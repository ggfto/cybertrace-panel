# ============================================================
# Cybertrace Panel no navegador, publicado via Cloudflare Tunnel.
#
# Padrao: o cf-tunnel-init provisiona o tunnel pela API (idempotente), renderiza
# o ingress e faz upsert do DNS; o cloudflared sobe depois e le o config.yml do
# volume compartilhado. Nao ha tunnel criado no painel, nem token em linha de
# comando, nem porta publicada no host.
#
# Toda a configuracao vem do .env ao lado deste arquivo (veja .env.example).
#   cp .env.example .env && $EDITOR .env && docker compose up -d
# ============================================================

# Nome do projeto vem do .env, nao do nome do diretorio — sem isso a rede e o
# prefixo dos recursos mudariam conforme onde o arquivo estivesse.
name: ${STACK_NAME:-cybertrace}

services:
  painel:
    image: ${CYBERTRACE_IMAGE:-ghcr.io/ggfto/cybertrace-panel}:${CYBERTRACE_TAG:-latest-web}
    container_name: ${STACK_NAME:-cybertrace}-painel
    restart: ${RESTART_POLICY:-unless-stopped}
    # expose, nao ports: so o cloudflared enxerga, nada abre no host.
    expose:
      - "${APP_PORT:-7681}"
    environment:
      TTYD_PORT: ${APP_PORT:-7681}
      TTYD_MAX_CLIENTS: ${TTYD_MAX_CLIENTS:-5}
      TTYD_TITLE: ${TTYD_TITLE:-Cybertrace Panel}
      # Defesa em profundidade: mesmo atras do Cloudflare Access.
      TTYD_CREDENTIAL: ${TTYD_CREDENTIAL:-}
      LINKETRACK_USER: ${LINKETRACK_USER:-}
      LINKETRACK_TOKEN: ${LINKETRACK_TOKEN:-}
    volumes:
      - historico:/data
    healthcheck:
      # 401 conta como saudavel: com TTYD_CREDENTIAL definido o ttyd exige basic
      # auth, e `curl -f` trataria a resposta como falha. O que o healthcheck
      # precisa saber e se o ttyd esta servindo, nao se este curl tem senha.
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:${APP_PORT:-7681}/ | grep -qE '^(200|401)$$'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Roda ate o fim e sai 0; o cloudflared so comeca depois disso.
  tunnel-init:
    image: ghcr.io/ggfto/cf-tunnel-init:${CF_TUNNEL_INIT_TAG:-latest}
    container_name: ${STACK_NAME:-cybertrace}-tunnel-init
    restart: "no"
    environment:
      # Escopos: Account > Cloudflare Tunnel: Edit, e Zone > DNS: Edit nesta zona.
      CF_API_TOKEN: ${CF_API_TOKEN:?defina CF_API_TOKEN no .env}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:?defina CF_ACCOUNT_ID no .env}
      CF_ZONE_ID: ${CF_ZONE_ID:?defina CF_ZONE_ID no .env}
      TUNNEL_NAME: ${TUNNEL_NAME:-cybertrace}
      CF_HOSTNAME: ${APP_HOSTNAME:?defina APP_HOSTNAME no .env}
      CF_SERVICE: http://${STACK_NAME:-cybertrace}-painel:${APP_PORT:-7681}
    volumes:
      - cf-runtime:/etc/cloudflared

  tunnel:
    image: cloudflare/cloudflared:${CLOUDFLARED_TAG:-latest}
    container_name: ${STACK_NAME:-cybertrace}-tunnel
    restart: ${RESTART_POLICY:-unless-stopped}
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      # Somente leitura: so o init escreve aqui.
      - cf-runtime:/etc/cloudflared:ro
    depends_on:
      tunnel-init:
        condition: service_completed_successfully
      painel:
        condition: service_healthy

volumes:
  historico:
    name: ${STACK_NAME:-cybertrace}-historico
  cf-runtime:
    name: ${STACK_NAME:-cybertrace}-cf-runtime
